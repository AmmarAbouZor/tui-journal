name: Homebrew Bump Formula
on:
  workflow_dispatch:
  release:
    types: [released]
jobs:
  homebrew:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Get Latest Tag
        id: ltag
        run: |
          git fetch --tags
          echo "GIT_TAG=$(git describe --tags "$(git rev-list --tags --max-count=1)")" >> "$GITHUB_OUTPUT"
      - name: Debug tag
        env:
          GIT_TAG: ${{ steps.ltag.outputs.GIT_TAG }}
        run: |
          echo "-------------------------------------------------------------"
          echo "$GIT_TAG"
          echo "-------------------------------------------------------------"

      - name: Trust Homebrew Tap
        run: |
          /home/linuxbrew/.linuxbrew/bin/brew tap AmmarAbouZor/homebrew-tui-journal
          /home/linuxbrew/.linuxbrew/bin/brew trust ammarabouzor/tui-journal

      - name: Bump Homebrew Formula
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.HOMEBREW_GITHUB_API_TOKEN }}
          GIT_TAG: ${{ steps.ltag.outputs.GIT_TAG }}
        run: |
          git config --global user.name "Ammar Abou Zor"
          git config --global user.email "AmmarAbouZor@users.noreply.github.com"
          /home/linuxbrew/.linuxbrew/bin/brew bump-formula-pr \
            --no-audit \
            --no-browse \
            --no-fork \
            --version="${GIT_TAG#v}" \
            ammarabouzor/tui-journal/tui-journal
