name: release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    if: github.repository == 'AmmarAbouZor/tui-journal'
    name: build-release
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        # Asset names are referenced by the Homebrew formula.
        include:
          - os: ubuntu-latest
            container: rust
            target: x86_64-unknown-linux-gnu
            asset: linux-gnu
          - os: ubuntu-24.04-arm
            container: rust
            target: aarch64-unknown-linux-gnu
            asset: linux-arm64
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: mac-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: win

    steps:
      - uses: actions/checkout@v7

      - name: Validate tag
        shell: bash
        run: |
          [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]

      - name: Install Latest Rust
        run: |
          rustup update --no-self-update stable
          rustup default stable

      # Explicit targets make a runner architecture change fail the build
      # instead of publishing a binary under the wrong asset name.
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        if: runner.os != 'Windows'
        run: |
          strip target/${{ matrix.target }}/release/tjournal
          mkdir -p release
          tar -C target/${{ matrix.target }}/release -czvf release/tjournal-${{ matrix.asset }}.tar.gz tjournal

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p release
          7z -y a release/tjournal-${{ matrix.asset }}.zip target/${{ matrix.target }}/release/tjournal.exe

      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.asset }}
          path: release/*
          if-no-files-found: error

  # Publishes once after all builds succeed, so a release never misses assets.
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true

      - name: release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          tag_name: ${{ github.ref_name }}
          files: release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
